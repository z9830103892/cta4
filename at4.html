<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interest Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f7fa;
            --text: #111;
            --card: #ffffff;
            --accent: #2979ff;
        }
        [data-theme="dark"] {
            --bg: #0d1117;
            --text: #e6edf3;
            --card: #161b22;
            --accent: #4c8dff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "Inter", sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s ease;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 380px;
            margin-bottom: 25px;
            transition: 0.3s;
        }
        label, input, select, button {
            width: 100%;
            font-size: 1rem;
            margin: 10px 0;
        }
        input, select {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #aaa;
            background: var(--card);
            color: var(--text);
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 12px;
        }
        button:hover {
            opacity: 0.85;
        }
        #chartContainer {
            width: 600px;
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        #toggleTheme {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #777;
        }
    </style>
</head>
<body data-theme="light">

<button id="toggleTheme">🌙 Dark Mode</button>

<h1>Interest Calculator</h1>

<div class="card">
    <label>Initial deposit</label>
    <input type="number" id="fname">

    <label>Annual interest rate (%)</label>
    <input type="number" id="lname">

    <label>Number of years</label>
    <input type="number" id="age">

    <label>Compounding period</label>
    <select id="periods">
        <option value="1">Annually</option>
        <option value="4">Quarterly</option>
        <option value="12">Monthly</option>
    </select>

    <button onclick="calculate()">Calculate</button>
    <div id="money"></div>
</div>

<div id="chartContainer">
    <canvas id="interestChart"></canvas>
</div>

<script>
let chart;

document.getElementById("toggleTheme").onclick = function () {
    const body = document.body;
    const current = body.getAttribute("data-theme");
    body.setAttribute("data-theme", current === "light" ? "dark" : "light");
    this.textContent = current === "light" ? "☀️ Light Mode" : "🌙 Dark Mode";
};

function calculate() {
    let deposit = parseFloat(document.getElementById("fname").value);
    let rate = parseFloat(document.getElementById("lname").value);
    let years = parseFloat(document.getElementById("age").value);
    let periods = parseInt(document.getElementById("periods").value);

    let ratePer = rate / periods / 100;
    let totalPeriods = years * periods;

    let finalAmount = deposit * Math.pow((1 + ratePer), totalPeriods);
    let interestEarned = finalAmount - deposit;

    document.getElementById("money").textContent = "Total interest: $" + interestEarned.toFixed(2);

    let yearLabels = [1, 2, 3];
    let interestValues = yearLabels.map(y => deposit * Math.pow((1 + ratePer), y * periods) - deposit);

    if(chart) chart.destroy();

    const ctx = document.getElementById('interestChart');
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: yearLabels.map(y => y + " year"),
            datasets: [{
                label: 'Interest Growth',
                data: interestValues,
                borderWidth: 3
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: true }
            }
        }
    });
}
</script>
</body>
</html>
